name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package macOS ${{ matrix.asset_arch }}
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            asset_arch: arm64
          - arch: x86_64
            asset_arch: amd64
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Validate version and bilingual release notes
        run: python3 .github/scripts/release.py check-notes "$GITHUB_REF_NAME" --repository "$GITHUB_REPOSITORY"
      - name: Run Swift unit tests
        if: matrix.arch == 'arm64'
        run: swift test
      - name: Build macOS app
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          xcodebuild -project AGYSwitcher.xcodeproj -scheme AGYSwitcher \
            -configuration Release -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/build" CODE_SIGNING_ALLOWED=NO \
            "ARCHS=$BUILD_ARCH" ONLY_ACTIVE_ARCH=NO \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS=AGY_RELEASE_BUILD \
            MARKETING_VERSION="$version" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" build
          app="$RUNNER_TEMP/build/Build/Products/Release/AGY Switcher.app"
          info="$app/Contents/Info.plist"
          test "$(plutil -extract CFBundleShortVersionString raw "$info")" = "$version"
          test "$(plutil -extract CFBundleVersion raw "$info")" = "$GITHUB_RUN_NUMBER"
          executable="$(plutil -extract CFBundleExecutable raw "$info")"
          test "$(lipo -archs "$app/Contents/MacOS/$executable")" = "$BUILD_ARCH"
      - name: Sign and notarize the disk image
        env:
          ASSET_ARCH: ${{ matrix.asset_arch }}
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          bash .github/scripts/package-macos.sh \
            "$RUNNER_TEMP/build/Build/Products/Release/AGY Switcher.app" \
            "$RUNNER_TEMP/release/AGY-Switcher-$GITHUB_REF_NAME-macOS-$ASSET_ARCH.dmg"
      - name: Upload signed installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agy-macos-${{ matrix.asset_arch }}
          path: ${{ runner.temp }}/release/AGY-Switcher-${{ github.ref_name }}-macOS-${{ matrix.asset_arch }}.dmg
          if-no-files-found: error
          overwrite: true

  publish:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Download signed installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: agy-macos-*
          path: ${{ runner.temp }}/release
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="$GITHUB_REF_NAME"
          assets=("AGY-Switcher-$tag-macOS-arm64.dmg" "AGY-Switcher-$tag-macOS-amd64.dmg")
          notes="docs/release/$tag.md"
          title="AGY Switcher $tag"
          paths=()
          for asset in "${assets[@]}"; do
            path="$RUNNER_TEMP/release/$asset"
            test -s "$path"
            paths+=("$path")
          done
          if release="$(gh release view "$tag" --json isDraft,assets)"; then
            if [[ "$(jq -r '.isDraft' <<< "$release")" == false ]]; then
              for asset in "${assets[@]}"; do
                jq -e --arg asset "$asset" '.assets | any(.name == $asset and .state == "uploaded")' \
                  <<< "$release" > /dev/null
              done
              echo "Release $tag is already published."
              exit 0
            fi
          else
            gh release create "$tag" --verify-tag --draft --title "$title" --notes-file "$notes"
          fi
          gh release upload "$tag" "${paths[@]}" --clobber
          gh release edit "$tag" --verify-tag --draft=false --title "$title" --notes-file "$notes"
